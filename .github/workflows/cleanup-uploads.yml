
name: Cleanup Uploads

on:
  workflow_dispatch:
  push:
    paths:
      - 'avisos/*.json'
      - 'avisos/**/*.json'
      - 'catalogo/*.json'
      - 'catalogo/**/*.json'
      - 'inmuebles/imagenes/**'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run unused file cleanup
        run: node scripts/manage-images.js --clean-orphan

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "Automated unused file cleanup"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
