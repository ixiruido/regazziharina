name: Renombrar Imágenes de Propiedades

on:
  push:
    paths:
      - 'catalogo/*.json'
  workflow_dispatch:

jobs:
  rename-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Renombrar imágenes con ID de propiedad
        run: node scripts/rename-property-images.js

      - name: Commit cambios
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "Renombrar imágenes con ID de propiedad [skip ci]"

      - name: Push cambios
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
