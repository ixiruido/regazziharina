name: Workflow de Propiedades

on:
  push:
    paths:
      - 'catalogo/*.json'
      - 'avisos/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-properties:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Asignar números secuenciales
        run: node scripts/assign-property-number.js

      - name: Renombrar imágenes de propiedades
        run: node scripts/rename-property-images.js

      - name: Generar índices
        run: node scripts/generate-index.js

      - name: Limpiar archivos sin referencias
        run: node scripts/manage-uploads.js --clean-orphan

      - name: Guardar y subir todos los cambios
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A

          if git diff --staged --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Actualizar propiedades, imágenes e índices [skip ci]"
            git push origin HEAD:main
          fi
