name: Actualizar propiedades

on:
  workflow_dispatch:
    inputs:
      demo_target:
        description: 'Nombre de la subcarpeta de la demo'
        required: true
        default: 'inm'

permissions:
  contents: write

jobs:

  actualizar:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # DESCARGAR REPOSITORIO
      # ==========================================

      - name: Descargar repositorio

        uses: actions/checkout@v5


      # ==========================================
      # DEFINIR RUTAS
      # ==========================================

      - name: Preparar rutas

        run: |

          echo "TARGET_DIR=demo/${{ github.event.inputs.demo_target }}" >> "$GITHUB_ENV"

          echo "IMAGE_DIR=demo/${{ github.event.inputs.demo_target }}/imagenes" >> "$GITHUB_ENV"

          echo "TARGET_FILE=demo/${{ github.event.inputs.demo_target }}/catalogo.json" >> "$GITHUB_ENV"


      # ==========================================
      # DESCARGAR JSON DESDE GOOGLE
      # ==========================================

      - name: Descargar JSON desde Google Apps Script

        run: |

          URL="https://script.google.com/macros/s/AKfycbzxOBarAlJ_G4TFpknreYtwDv3RcIKybCIf8UadpipnsrNclSomTlRS1nsZrdLP5IB6vA/exec"

          echo "Descargando catálogo..."

          for i in 1 2 3 4 5
          do

            echo "Intento $i..."

            if curl -fL \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 60 \
              "$URL" \
              -o catalogo_nuevo.json
            then

              echo "Descarga correcta."

              break

            fi


            if [ "$i" -eq 5 ]
            then

              echo "ERROR: No se pudo descargar el JSON."

              exit 1

            fi


            echo "Esperando antes de volver a intentar..."

            sleep 5

          done


      # ==========================================
      # MOSTRAR JSON
      # ==========================================

      - name: Mostrar respuesta recibida

        run: |

          echo "Tamaño:"

          wc -c catalogo_nuevo.json

          echo ""

          echo "Primeros 3000 caracteres:"

          head -c 3000 catalogo_nuevo.json

          echo ""


      # ==========================================
      # VALIDAR JSON
      # ==========================================

      - name: Validar JSON

        run: |

          python -m json.tool \
            catalogo_nuevo.json \
            > /dev/null

          echo "JSON válido."


      # ==========================================
      # CREAR CARPETA DE IMÁGENES
      # ==========================================

      - name: Crear carpeta de imágenes

        run: |

          mkdir -p "$IMAGE_DIR"


      # ==========================================
      # DESCARGAR IMÁGENES
      # ==========================================

      - name: Descargar imágenes

        run: |

          python << 'PY'

          import json
          import os
          import urllib.request
          import time


          JSON_FILE = "catalogo_nuevo.json"

          IMAGE_DIR = os.environ["IMAGE_DIR"]


          # ==========================================
          # LEER JSON
          # ==========================================

          with open(
              JSON_FILE,
              "r",
              encoding="utf-8"
          ) as archivo:

              catalogo = json.load(
                  archivo
              )


          propiedades = catalogo.get(
              "propiedades",
              []
          )


          print(
              "Cantidad de propiedades:",
              len(propiedades)
          )


          # ==========================================
          # PROCESAR CADA PROPIEDAD
          # ==========================================

          for propiedad in propiedades:

              nombre = propiedad.get(
                  "foto",
                  ""
              )

              url = propiedad.get(
                  "fotoUrl",
                  ""
              )


              # --------------------------------------
              # SI NO TIENE IMAGEN
              # --------------------------------------

              if not nombre or not url:

                  propiedad["foto"] = ""


                  if "fotoUrl" in propiedad:

                      del propiedad["fotoUrl"]


                  continue


              # --------------------------------------
              # RUTA DESTINO
              # --------------------------------------

              destino = os.path.join(
                  IMAGE_DIR,
                  nombre
              )


              print("")
              print(
                  "================================"
              )

              print(
                  "Imagen:",
                  nombre
              )

              print(
                  "URL:",
                  url
              )


              descargada = False


              # ======================================
              # REINTENTAR HASTA 5 VECES
              # ======================================

              for intento in range(1, 6):

                  try:

                      print(
                          "Intento:",
                          intento
                      )


                      request = urllib.request.Request(

                          url,

                          headers={
                              "User-Agent":
                                  "Mozilla/5.0"
                          }

                      )


                      with urllib.request.urlopen(
                          request,
                          timeout=60
                      ) as response:

                          contenido = response.read()


                      if not contenido:

                          raise Exception(
                              "La imagen está vacía."
                          )


                      # --------------------------------
                      # GUARDAR IMAGEN
                      # --------------------------------

                      with open(
                          destino,
                          "wb"
                      ) as archivo:

                          archivo.write(
                              contenido
                          )


                      print(
                          "Imagen descargada correctamente."
                      )

                      print(
                          "Bytes:",
                          len(contenido)
                      )


                      descargada = True

                      break


                  except Exception as error:

                      print(
                          "ERROR:",
                          error
                      )


                      if intento < 5:

                          print(
                              "Esperando 5 segundos..."
                          )

                          time.sleep(5)


              # ======================================
              # ACTUALIZAR JSON
              # ======================================

              if descargada:

                  propiedad["foto"] = (
                      "imagenes/" + nombre
                  )

              else:

                  print(
                      "ADVERTENCIA: No se pudo descargar:",
                      nombre
                  )

                  propiedad["foto"] = ""


              # --------------------------------------
              # ELIMINAR URL TEMPORAL
              # --------------------------------------

              if "fotoUrl" in propiedad:

                  del propiedad["fotoUrl"]


          # ==========================================
          # GUARDAR JSON MODIFICADO
          # ==========================================

          with open(
              JSON_FILE,
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  catalogo,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "================================"
          )

          print(
              "JSON actualizado."
          )

          print(
              "Las URLs temporales fueron eliminadas."
          )

          print(
              "Las fotos ahora apuntan a /imagenes/."
          )

          PY


      # ==========================================
      # MOSTRAR JSON FINAL
      # ==========================================

      - name: Mostrar JSON final

        run: |

          echo "Contenido final de catalogo.json:"

          cat catalogo_nuevo.json


      # ==========================================
      # ACTUALIZAR CATALOGO
      # ==========================================

      - name: Actualizar catálogo

        run: |

          mkdir -p "$TARGET_DIR"

          mv \
            catalogo_nuevo.json \
            "$TARGET_FILE"


          echo "Catálogo actualizado:"

          ls -lh "$TARGET_FILE"


      # ==========================================
      # LIMPIAR IMÁGENES ANTIGUAS
      # ==========================================

      - name: Limpiar imágenes antiguas

        run: |

          python << 'PY'

          import json
          import os
          import glob


          IMAGE_DIR = os.environ["IMAGE_DIR"]

          TARGET_FILE = os.environ["TARGET_FILE"]


          # ==========================================
          # VERIFICAR CATÁLOGO
          # ==========================================

          if not os.path.exists(
              TARGET_FILE
          ):

              print(
                  "No existe el catálogo."
              )

              exit(0)


          # ==========================================
          # LEER CATALOGO
          # ==========================================

          with open(
              TARGET_FILE,
              "r",
              encoding="utf-8"
          ) as archivo:

              catalogo = json.load(
                  archivo
              )


          propiedades = catalogo.get(
              "propiedades",
              []
          )


          # ==========================================
          # OBTENER IMÁGENES VÁLIDAS
          # ==========================================

          imagenes_validas = set()


          for propiedad in propiedades:

              foto = propiedad.get(
                  "foto",
                  ""
              )


              if foto:

                  # Solo guardar el nombre
                  # imagenes/propiedad-2.jpg
                  # -> propiedad-2.jpg

                  nombre = os.path.basename(
                      foto
                  )


                  imagenes_validas.add(
                      nombre
                  )


          print(
              "Imágenes que deben existir:"
          )

          for imagen in sorted(
              imagenes_validas
          ):

              print(
                  "-",
                  imagen
              )


          # ==========================================
          # BUSCAR ARCHIVOS ACTUALES
          # ==========================================

          archivos = glob.glob(
              os.path.join(
                  IMAGE_DIR,
                  "*"
              )
          )


          # ==========================================
          # ELIMINAR SOBRANTES
          # ==========================================

          for archivo in archivos:

              if not os.path.isfile(
                  archivo
              ):

                  continue


              nombre = os.path.basename(
                  archivo
              )


              if nombre not in imagenes_validas:

                  print(
                      "Eliminando imagen antigua:",
                      nombre
                  )

                  os.remove(
                      archivo
                  )


          print(
              "Limpieza de imágenes terminada."
          )

          PY


      # ==========================================
      # MOSTRAR CAMBIOS
      # ==========================================

      - name: Mostrar cambios

        run: |

          echo "================================="

          echo "CAMBIOS DETECTADOS"

          echo "================================="

          git status --short


      # ==========================================
      # GUARDAR CAMBIOS EN GITHUB
      # ==========================================

      - name: Guardar cambios en GitHub

        run: |

          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # Agregar catálogo e imágenes

          git add "$TARGET_DIR"


          # ==========================================
          # COMPROBAR SI HAY CAMBIOS
          # ==========================================

          if git diff --cached --quiet
          then

            echo "No hay cambios para guardar."

          else

            echo "Hay cambios."

            git commit \
              -m "Actualizar propiedades: ${{ github.event.inputs.demo_target }}"


            git push

            echo "Cambios enviados a GitHub."

          fi
