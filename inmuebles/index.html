<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Catálogo</title>

    <link
        rel="stylesheet"
        href="catalogo.css"
    >

</head>

<body>

<main
    id="catalogo-app"
    class="catalogo"
>

        <div class="catalogo-controles">

            <div class="buscador">

                <span>
                    🔎
                </span>

                <input
                    type="search"
                    id="buscador"
                    placeholder="Buscar propiedades..."
                    autocomplete="off"
                >

            </div>

            <div class="filtros-grupo">
                <select
                    id="localidades-select"
                    class="localidades-select"
                    aria-label="Localidades"
                >
                    <option value="Todas">Localidad</option>
                </select>

                <select
                    id="categorias-select"
                    class="categorias-select"
                    aria-label="Categorías"
                >
                    <option value="Todas">Categoría</option>
                </select>

                <select
                    id="ordenar"
                    aria-label="Ordenar productos"
                >

                    <option value="orden">
                        Ordenar
                    </option>

                    <option value="precio-asc">
                        Precio: menor a mayor
                    </option>

                    <option value="precio-desc">
                        Precio: mayor a menor
                    </option>

                </select>
            </div>

        </div>

    </header>


    <div class="catalogo-info">

        <span id="contador">
            Cargando propiedades...
        </span>

    </div>


    <section
        id="productos"
        class="productos"
    >
    </section>


    <div
        id="sinResultados"
        class="sin-resultados oculto"
    >

        <div class="sin-resultados-icono">
            🔎
        </div>

        <h2>
            No encontramos propiedades
        </h2>

        <p>
            Probá con otro término o categoría.
        </p>

    </div>


    <!-- PAGINACIÓN -->

    <nav
        id="paginacion"
        class="paginacion"
        aria-label="Paginación del catálogo"
    >
    </nav>

    <!-- MODAL DE PRODUCTO (para fallback si no hay comunicación con página principal) -->
    <div id="producto-modal" class="producto-modal oculto">
        <div class="modal-content">
            <button class="modal-close" aria-label="Cerrar modal">
                ✕
            </button>
            <div class="modal-body">
                <div class="modal-imagen">
                    <img id="modal-img" src="" alt="">
                </div>
                <div class="modal-info">
                    <span id="modal-categoria" class="modal-categoria"></span>
                    <h2 id="modal-nombre"></h2>
                    <div id="modal-descripcion" class="modal-descripcion"></div>
                    <div id="modal-precio" class="modal-precio"></div>
                    <div id="modal-stock" class="modal-stock"></div>
                    <button id="modal-whatsapp" class="modal-whatsapp-btn">
                        Consultar
                    </button>
                </div>
            </div>
        </div>
    </div>


</main>


<script src="./catalogo.js"></script>

</body>

</html>
