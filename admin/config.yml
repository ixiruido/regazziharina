
# Configuración del backend de GitHub
backend:
  name: github
  repo: ixiruido/regazziharina
  branch: main
  base_url: https://regazziharina-decap-github-auth.ixi-b.workers.dev
  auth_endpoint: auth

# Configuración de archivos adjuntos
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Configuración de las colecciones
collections:
  - name: "configuracion_web"
    label: "Panel de Avisos"
    delete: false

    files:
      - name: "avisos_json"
        label: "Editar Avisos"
        file: "avisos.json"
        format: "json"

        fields:
          - name: "avisos"
            label: "Avisos Publicados"
            widget: "list"
            required: false
            summary: "{{fields.titulo}} ({{fields.fecha}})"

            fields:
              - name: "titulo"
                label: "Título del Aviso"
                widget: "string"
                required: true

              - name: "fecha"
                label: "Fecha de Publicación"
                widget: "string"
                required: true
                hint: "Ejemplo: 29/08/2026"

              - name: "autor"
                label: "Autor / Cargo"
                widget: "string"
                required: true

              - name: "texto"
                label: "Texto del Aviso"
                widget: "string"
                required: true

              - name: "adjunto"
                label: "Documento Adjunto (PDF o Imagen)"
                widget: "file"
                required: false

  - name: "configuracion_web"
    label: "Panel de Inmuebles"
    delete: false
    files:
      - name: "catalogo_json"
        label: "Editar Inmuebles"
        file: "/inmuebles/catalogo.json"
        format: "json"    

        fields:
          - name: "inmuebles"
            label: "Inmuebles Publicados"
            widget: "list"
            required: false
            summary: "{{fields.titulo}} ({{fields.fecha}})"
