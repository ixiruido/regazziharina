backend:
  name: github
  repo: <ixiruido>/<patagoniacodex>
  branch: main
  site_domain: patagoniacodex.pages.dev
  base_url: https://<TU-WORKER-AUTH>.workers.dev # El mediador de login
  auth_endpoint: auth

# Rutas de Archivos en tu repositorio de GitHub
media_folder: "images" # Ruta desde la raíz de GitHub para guardar fotos
public_folder: "images" # Cómo lee tu HTML las fotos (relativo a su index.html)

collections:
  - name: "inmuebles"
    label: "Catálogo de Inmuebles"
    # Apuntamos a la subcarpeta exacta donde está tu archivo JSON
    folder: "main" 
    extension: "json"
    format: "json"
    create: true
    slug: "{{fields.id}}"
    # IMPORTANTE: Cambia "inmuebles.json" por el nombre exacto de tu archivo
    files:
      - label: "Lista de Inmuebles"
        name: "lista_inmuebles"
        file: "main/inmuebles.json" 
        fields:
          - label: "Inmuebles"
            name: "inmuebles"
            widget: "list"
            fields:
              - { label: "ID Único", name: "id", widget: "string" }
              - { label: "Nombre", name: "title", widget: "string" }
              - { label: "Precio", name: "price", widget: "number", value_type: "float" }
              - { label: "Descripción", name: "description", widget: "text" }
              - { label: "Foto", name: "image", widget: "image" }
