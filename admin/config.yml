locale: "es"
# Configuración del backend de GitHub
backend:
  name: github
  repo: ixiruido/regazziharina
  branch: main
  base_url: https://regazziharina-decap-github-auth.ixi-b.workers.dev
  auth_endpoint: auth

# Configuración de archivos adjuntos
media_folder: "../inmuebles/imagenes"
public_folder: "../inmuebles/imagenes"

# Configuración de las colecciones
collections:
  - name: "avisos"
    label: "Editar Avisos"
    folder: "avisos"
    create: true
    slug: "{{slug}}-{{year}}{{month}}{{day}}"
    identifier_field: "titulo"
    summary: "{{titulo}} - {{fecha}} - {{autor}}"
    extension: "json"
    format: "json"
    delete: true

    fields:
      - name: "titulo"
        label: "Título del Aviso"
        widget: "string"
        required: true

      - name: "fecha"
        label: "Fecha de Publicación"
        widget: "string"
        required: true
        hint: "Ejemplo: 29/08/2026"

      - name: "autor"
        label: "Autor / Cargo"
        widget: "string"
        required: true

      - name: "texto"
        label: "Texto del Aviso"
        widget: "text"
        required: true

      - name: "adjunto"
        label: "Documento Adjunto (PDF o Imagen)"
        widget: "file"
        required: false

 
  - name: "catalogo"
    label: "Catálogo de Inmuebles"
    folder: "catalogo"
    create: true
    slug: "propiedad-{{slug}}"
    identifier_field: "localidad"
    summary: "{{localidad}} - {{tipo}} - {{direccion}}"
    extension: "json"
    format: "json"
    delete: true

    fields:

      - name: "tipo"
        label: "Tipo de propiedad"
        widget: "select"
        options:
          - { label: "Casa", value: "Casa" }
          - { label: "Departamento", value: "Departamento" }
          - { label: "Terreno", value: "Terreno" }
          - { label: "Local", value: "Local" }
          - { label: "Oficina", value: "Oficina" }
          - { label: "Otro", value: "Otro" }
        required: true

      - name: "localidad"
        label: "Localidad"
        widget: "string"
        required: true

      - name: "direccion"
        label: "Dirección"
        widget: "string"
        required: true

      - name: "categoria"
        label: "Operación"
        widget: "select"
        options:
          - { label: "Venta", value: "Venta" }
          - { label: "Alquiler", value: "Alquiler" }
          - { label: "Alquiler Comercial", value: "Alquiler Comercial" }
        required: true

      - name: "tamanio"
        label: "Superficie en m²"
        widget: "number"
        value_type: "int"
        required: true

      - name: "precio"
        label: "Precio"
        widget: "string"
        required: true
        hint: "Ej.: USD 95.000 o ARS 450.000"

      - name: "fotos"
        label: "Fotos de la propiedad (máximo 5)"
        widget: "list"
        required: false
        max: 5
        field:
          label: "Archivo de imagen"
          name: "foto"
          widget: "image"
          media_folder: "../inmuebles/imagenes"
          public_folder: "../inmuebles/imagenes"

      - name: "detalles"
        label: "Descripción"
        widget: "text"
        required: true

      - name: "capacidad"
        label: "Capacidad / Habitaciones / Personas"
        widget: "string"
        required: false

      - name: "orden"
        label: "Orden de aparición"
        widget: "number"
        value_type: "int"
        required: false
        hint: "Número menor aparece primero. Dejar vacío para enviar al final."

      - name: "visible"
        label: "Publicación visible en la web"
        widget: "select"
        default: "SI"
        options:
          - { label: "Sí, visible", value: "SI" }
          - { label: "No, ocultar", value: "NO" }
        required: true

      - name: "destacado"
        label: "Destacar propiedad"
        widget: "select"
        default: "NO"
        options:
          - { label: "Sí, destacada", value: "SI" }
          - { label: "No destacada", value: "NO" }
        required: true

      - name: "stock"
        label: "Disponibilidad"
        widget: "select"
        default: "SI"
        options:
          - { label: "Disponible", value: "SI" }
          - { label: "No disponible", value: "NO" }
        required: true
