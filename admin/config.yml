# Configuración del backend (Integración con GitHub)
backend:
  name: github
  repo: ixiruido/regazziharina # REEMPLAZA CON TUS DATOS
  branch: main # O la rama que uses para GitHub Pages (ej. gh-pages)
  base_url: https://regazziharina-decap-github-auth.ixi-b.workers.dev/
  auth_endpoint: auth

# Ruta pública donde se subirán los archivos adjuntos (PDFs, imágenes, etc.)
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Configuración de las colecciones de datos
collections:
  - name: "configuracion_web"
    label: "Panel de Avisos"
    delete: false # Evita que borren el archivo por error
    files:
      - name: "avisos_json"
        label: "Lista de Avisos"
        # REEMPLAZA con la ruta exacta donde lee tu web el JSON (ej. "data/avisos.json" o "avisos.json")
        file: "../avisos.json" 
        format: "json" # Fuerza a Decap CMS a escribir en JSON puro
        
        fields:
          - name: "avisos"
            label: "Anuncios Publicados"
            widget: "list" # Permite agregar, mover y eliminar anuncios secuencialmente
            summary: "{{fields.titulo}} ({{fields.fecha}})" # Vista previa rápida en el panel
            
            fields:
              - { label: "Título del Aviso", name: "titulo", widget: "string", required: true }
              - { label: "Fecha de Publicación", name: "fecha", widget: "string", required: true, hint: "Ejemplo: 29/08/2026" }
              - { label: "Autor / Cargo", name: "autor", widget: "string", required: true }
              - { label: "Cuerpo del Mensaje", name: "texto", widget: "markdown", required: true }
              - { label: "Documento Adjunto (PDF o Imagen)", name: "adjunto", widget: "file", required: false }
