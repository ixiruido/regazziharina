<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración</title>

  <!-- Google Fonts para una tipografía más profesional -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Estilos globales y reseteo */
    body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc; /* Fondo gris slate claro muy moderno */
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Pantalla de carga (Loader) personalizada */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, vertical-align 0.5s ease;
    }

    /* Contenedor del Logo */
    .loader-logo {
      max-width: 150px; /* Ajusta el tamaño de tu logo */
      height: auto;
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }

    /* Animación sutil para el logo */
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.04); opacity: 1; }
    }

    /* Anillo de carga (Spinner) */
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #3b82f6; /* Azul moderno de carga */
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Texto de carga */
    .loading-text {
      margin-top: 16px;
      color: #64748b;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    /* Estilos inyectados para el login y componentes internos de Decap */
    /* Nota: Esto estiliza los botones que genera Decap dinámicamente */
    .nc-app-layout-window {
      font-family: 'Inter', sans-serif !important;
    }
  </style>
</head>
<body>

  <!-- Esta pantalla se muestra de inmediato mientras Decap-CMS se descarga e inicializa -->
  <div id="loading-screen">
    <!-- REEMPLAZA ESTA RUTA POR TU LOGO REAL (ej. /images/logo.png o svg) -->
    <img class="loader-logo" src="../images/foto.png" alt="Cargando Panel...">
    <div class="spinner"></div>
    <p class="loading-text">Iniciando sesión de administración...</p>
  </div>



  
  <!-- Script Principal de Decap CMS -->
  <script src="https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js"></script>
<script>
  CMS.registerPreviewStyle("/admin/preview.css");
</script>

<script>
  CMS.registerEventListener({
    name: "preSave",
    handler: async ({ entry }) => {
      const collection = entry.get("collection");
      const collectionName = collection.get("name");

      // Solo actuar sobre la colección de catálogo (propiedades individuales)
      if (collectionName !== "catalogo") {
        return;
      }

      const data = entry.get("data");
      const idActual = data.get("id");

      // Si ya tiene un ID asignado, no modificar
      if (idActual && String(idActual).trim() !== "") {
        return;
      }

      // Obtener el máximo ID existente leyendo el archivo de índice
      try {
        const response = await fetch("/catalogo-index.json");
        const indexData = await response.json();

        let maxId = 0;
        if (indexData.files && Array.isArray(indexData.files)) {
          for (const file of indexData.files) {
            try {
              const fileResponse = await fetch(`/catalogo/${file}`);
              const fileData = await fileResponse.json();
              const fileId = Number(fileData.id);
              if (Number.isInteger(fileId) && fileId > maxId) {
                maxId = fileId;
              }
            } catch (e) {
              console.error("Error reading property file:", e);
            }
          }
        }

        // Asignar el siguiente ID
        const nuevoId = maxId + 1;
        return data.set("id", nuevoId);
      } catch (error) {
        console.error("Error generating auto ID:", error);
        // Fallback: usar timestamp si falla la lectura del índice
        return data.set("id", Date.now());
      }
    }
  });
</script>

<!-- Preview personalizado para Avisos -->
<script>
  const AvisosPreview = ({ entry }) => {
    const data = entry.getIn(['data']).toJS();
    return React.createElement('div', { className: 'cms-preview-avisos' },
      React.createElement('h1', {}, data.titulo || 'Sin título'),
      React.createElement('div', { className: 'cms-preview-field' },
        React.createElement('span', { className: 'cms-preview-label' }, 'Fecha'),
        React.createElement('p', {}, data.fecha || 'Sin fecha')
      ),
      React.createElement('div', { className: 'cms-preview-field' },
        React.createElement('span', { className: 'cms-preview-label' }, 'Autor'),
        React.createElement('p', {}, data.autor || 'Sin autor')
      ),
      React.createElement('div', { className: 'cms-preview-field' },
        React.createElement('span', { className: 'cms-preview-label' }, 'Texto'),
        React.createElement('p', {}, data.texto || 'Sin texto')
      ),
      data.adjunto && React.createElement('div', { className: 'cms-preview-field' },
        React.createElement('span', { className: 'cms-preview-label' }, 'Adjunto'),
        React.createElement('img', { src: data.adjunto, alt: 'Adjunto' })
      )
    );
  };
  CMS.registerPreviewTemplate('avisos', AvisosPreview);
</script>

<!-- Preview personalizado para Catálogo de Inmuebles -->
<script>
  const CatalogoPreview = ({ entry }) => {
    const data = entry.getIn(['data']).toJS();
    const fotos = data.fotos || [];
    const fotoPrincipal = fotos.length > 0 ? (fotos[0].foto || fotos[0]) : null;

    return React.createElement('div', { className: 'cms-preview-catalogo' },
      React.createElement('div', { className: 'property-card' },
        fotoPrincipal && React.createElement('div', { className: 'property-images' },
          React.createElement('img', { src: fotoPrincipal, alt: data.titulo || 'Propiedad' })
        ),
        React.createElement('div', { className: 'property-info' },
          React.createElement('div', { className: 'property-category' }, `${data.categoria || ''} - ${data.tipo || ''}`),
          React.createElement('h2', { className: 'property-title' }, data.localidad || 'Sin localidad'),
          React.createElement('div', { className: 'property-address' }, data.direccion || 'Sin dirección'),
          React.createElement('div', { className: 'property-tags' },
            React.createElement('span', { className: 'property-tag location' }, data.localidad || ''),
            data.tamanio && React.createElement('span', { className: 'property-tag size' }, `${data.tamanio} m²`)
          ),
          React.createElement('div', { className: 'property-description' }, data.detalles || 'Sin descripción'),
          React.createElement('div', { className: 'property-price' }, data.precio || 'Sin precio')
        )
      )
    );
  };
  CMS.registerPreviewTemplate('catalogo', CatalogoPreview);
</script>


  
  <!-- Lógica para ocultar el loader una vez que Decap CMS se renderiza -->
  <script>
    // Decap CMS se monta en el body, por lo que usaremos un observador para detectar cuándo está listo
    const observer = new MutationObserver((mutations, obs) => {
      // Cuando Decap CMS inyecta su contenedor de React (suele tener clases que empiezan con nc-)
      if (document.body.children.length > 1) {
        const loader = document.getElementById('loading-screen');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 500); // Lo removemos del DOM tras la transición
        }
        obs.disconnect(); // Dejamos de observar para liberar memoria
      }
    });

    observer.observe(document.body, { childList: true });
  </script>


  
</body>
</html>
